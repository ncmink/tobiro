name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build (e.g. v0.0.1)'
        required: true
      protocol_ref:
        description: 'biebie-protocol ref to build against (blank = default branch)'
        required: false
        default: ''

env:
  APP_NAME: Tobiro
  GO_VERSION: '1.25.0'
  NODE_VERSION: '22'
  WAILS_VERSION: v3.0.0-beta.9
  PROTOCOL_REPO: ncmink/biebie-protocol

jobs:
  macos:
    name: Build macOS (.dmg + updater zip)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PROTOCOL_REPO }}
          ref: ${{ github.event.inputs.protocol_ref }}
          token: ${{ secrets.PROTOCOL_TOKEN }}
          path: biebie-protocol

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Version
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Wire biebie-protocol for CI
        run: go mod edit -replace github.com/ncmink/biebie-protocol=./biebie-protocol

      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/codesign.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERTIFICATE="$RUNNER_TEMP/certificate.p12"

          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 -D > "$CERTIFICATE"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign
          rm -f "$CERTIFICATE"

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$IDENTITY" ]; then
            echo "the supplied certificate holds no Developer ID Application identity" >&2
            exit 1
          fi
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Package universal .app
        run: wails3 task darwin:package:universal APP_VERSION="$APP_VERSION"

      - name: Codesign app bundle
        run: |
          set -euo pipefail
          codesign --force --timestamp --options runtime \
            --keychain "$SIGNING_KEYCHAIN" --sign "$SIGNING_IDENTITY" \
            "bin/${APP_NAME}.app"
          codesign --verify --strict --deep --verbose=2 "bin/${APP_NAME}.app"

      - name: Create .dmg
        run: wails3 task darwin:create:dmg

      - name: Rename artifacts
        run: |
          DMG="$(ls bin/*.dmg | head -n1)"
          mv "$DMG" "bin/${APP_NAME}-${VERSION}-macos-universal.dmg"
          ditto -c -k --keepParent "bin/${APP_NAME}.app" "bin/${APP_NAME}-${VERSION}-darwin-universal.zip"

      - name: Codesign .dmg
        run: |
          set -euo pipefail
          codesign --force --timestamp \
            --keychain "$SIGNING_KEYCHAIN" --sign "$SIGNING_IDENTITY" \
            "bin/${APP_NAME}-${VERSION}-macos-universal.dmg"

      - name: Notarize .dmg
        env:
          KEY_P8_BASE64: ${{ secrets.APPLE_NOTARIZATION_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/notarization-key.p8"
          DMG="bin/${APP_NAME}-${VERSION}-macos-universal.dmg"

          trap 'rm -f "$KEY"' EXIT
          printf '%s' "$KEY_P8_BASE64" | base64 -D > "$KEY"

          SUBMISSION="$(xcrun notarytool submit "$DMG" \
            --key "$KEY" --key-id "$KEY_ID" --issuer "$ISSUER_ID" \
            --output-format json | jq -r '.id')"
          echo "notarization submission: $SUBMISSION"

          STATUS="$(xcrun notarytool wait "$SUBMISSION" \
            --key "$KEY" --key-id "$KEY_ID" --issuer "$ISSUER_ID" \
            --output-format json | jq -r '.status')"
          echo "notarization status: $STATUS"

          if [ "$STATUS" != "Accepted" ]; then
            xcrun notarytool log "$SUBMISSION" \
              --key "$KEY" --key-id "$KEY_ID" --issuer "$ISSUER_ID" || true
            exit 1
          fi

          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Sign updater asset
        env:
          UPDATER_SIGNING_KEY: ${{ secrets.UPDATER_SIGNING_KEY }}
        run: go run ./cmd/sign-release "bin/${APP_NAME}-${VERSION}-darwin-universal.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            bin/*.dmg
            bin/*darwin-universal.zip
            bin/*darwin-universal.zip.sig
          if-no-files-found: error

      - name: Remove signing keychain
        if: always()
        working-directory: ${{ runner.temp }}
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12"
          security delete-keychain "$RUNNER_TEMP/codesign.keychain-db" 2>/dev/null || true

  windows:
    name: Build Windows (NSIS + updater zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PROTOCOL_REPO }}
          ref: ${{ github.event.inputs.protocol_ref }}
          token: ${{ secrets.PROTOCOL_TOKEN }}
          path: biebie-protocol

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Wire biebie-protocol for CI
        shell: bash
        run: go mod edit -replace github.com/ncmink/biebie-protocol=./biebie-protocol

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Package NSIS installer
        run: wails3 task windows:package APP_VERSION=${{ env.APP_VERSION }} INSTALL_SCOPE=user

      - name: Rename artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Move-Item "bin\$env:APP_NAME-*-installer.exe" "dist\$env:APP_NAME-$env:VERSION-windows-amd64-installer.exe"
          Compress-Archive -Path "bin\$env:APP_NAME.exe" -DestinationPath "dist\$env:APP_NAME-$env:VERSION-windows-amd64.zip"

      - name: Sign updater asset
        env:
          UPDATER_SIGNING_KEY: ${{ secrets.UPDATER_SIGNING_KEY }}
        run: go run ./cmd/sign-release "dist/${{ env.APP_NAME }}-${{ env.VERSION }}-windows-amd64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.zip.sig
          if-no-files-found: error

  release:
    name: Publish release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum Tobiro-* > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
