# When you update `info` or `protocols`, run from repo root:
#   wails3 task common:update:build-assets
version: '3'

info:
  companyName: "Tobiro"
  productName: "Tobiro"
  productIdentifier: "net.tobiro.access"
  description: "Desktop access manager for DevOps engineers."
  copyright: "© 2026, Tobiro"
  comments: "Part of the biebie.net product family."
  version: "0.0.4"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

fileAssociations:

protocols:
  - scheme: tobiro
    description: "Tobiro connection"
